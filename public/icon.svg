<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Ration">
  <!-- §15's nutrient bar, which is the app's own primitive: an unfilled track, a
       fill, and a tick at the target. Petrol field with a light mark rather than
       the reverse — at 16px a filled field carries where thin strokes on white
       do not, and a launcher icon has no page behind it to be light against.
       Colours mirror the primary and bg tokens; a manifest cannot read CSS variables. -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="#146C6A"/>
  <g fill="#F4F7F7">
    <rect x="88" y="208" width="336" height="96" rx="48" fill-opacity="0.3"/>
    <rect x="88" y="208" width="204" height="96" rx="48"/>
    <rect x="324" y="168" width="60" height="176" rx="30"/>
  </g>
</svg>
